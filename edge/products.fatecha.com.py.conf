server {
    listen 80;
    server_name products.fatecha.com.py;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name products.fatecha.com.py;

    ssl_certificate /etc/letsencrypt/live/products.fatecha.com.py/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/products.fatecha.com.py/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location / {
        set $products_upstream http://bootcamp-nginx:80;
        proxy_pass $products_upstream;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
